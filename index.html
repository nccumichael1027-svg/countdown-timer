<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116學測倒數66天｜懸浮能量卡牌</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Font Awesome 圖示 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 載入 Inter 與繁體中文字體 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        };
    </script>

    <style>
        /* =========================================
           全域樣式與星空漸層背景
        ========================================= */
        body {
            background: radial-gradient(ellipse at top, #111b36 0%, #090d1a 55%, #04060d 100%);
            color: #f8fafc;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
        }

        /* 科技感毛玻璃面板 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* 倒數數字微光特效 */
        .neon-digit {
            text-shadow: 0 0 18px currentColor;
        }

        /* =========================================
           懸浮能量卡牌與 3D 翻轉核心樣式
        ========================================= */
        .card-stage {
            perspective: 1200px;
            position: relative;
            padding-bottom: 18px;
        }

        /* 反重力微幅懸浮動畫 */
        .float-wrapper {
            animation: levitate var(--float-duration, 5.5s) ease-in-out var(--float-delay, 0s) infinite;
            will-change: transform;
        }

        .card-stage:hover .float-wrapper {
            animation-play-state: paused;
        }

        @keyframes levitate {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-9px);
            }
        }

        /* 底部懸浮光影（隨懸浮高度呼吸縮放） */
        .hover-shadow {
            position: absolute;
            bottom: 2px;
            left: 16%;
            right: 16%;
            height: 14px;
            border-radius: 9999px;
            background: radial-gradient(ellipse at center, var(--card-glow, rgba(56, 189, 248, 0.45)) 0%, transparent 72%);
            filter: blur(5px);
            animation: shadowPulse var(--float-duration, 5.5s) ease-in-out var(--float-delay, 0s) infinite;
            pointer-events: none;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        @keyframes shadowPulse {
            0%, 100% {
                transform: scaleX(1);
                opacity: 0.72;
            }
            50% {
                transform: scaleX(0.84);
                opacity: 0.38;
            }
        }

        .card-stage:hover .hover-shadow {
            transform: scaleX(1.06);
            opacity: 0.9;
        }

        /* 滑鼠 3D 磁浮傾斜層（獨立於翻轉層，避免 transform 互相覆蓋） */
        .tilt-shell {
            position: relative;
            width: 100%;
            height: 430px;
            transform-style: preserve-3d;
            transition: transform 0.25s ease-out;
            border-radius: 1.5rem;
        }

        /* 3D 翻轉本體 */
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 1.5rem;
        }

        .flip-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* 正面與背面共同設定 */
        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: linear-gradient(155deg, rgba(30, 41, 59, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42), 0 0 22px var(--card-glow-soft, rgba(56, 189, 248, 0.14));
        }

        .card-front {
            transform: rotateY(0deg) translateZ(1px);
            z-index: 2;
        }

        .card-back {
            transform: rotateY(180deg) translateZ(1px);
            z-index: 1;
        }

        /* 全息反光高光層 */
        .holo-sheen {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(
                circle 220px at var(--mx, 50%) var(--my, 50%),
                rgba(255, 255, 255, 0.22),
                rgba(255, 255, 255, 0.05) 45%,
                transparent 75%
            );
            z-index: 15;
        }

        .card-stage:hover .holo-sheen {
            opacity: 1;
        }

        /* 獨立鎖定遮罩層（置於 flip-inner 之外，完全不干擾 3D 翻轉渲染） */
        .lock-veil {
            position: absolute;
            inset: 0;
            z-index: 30;
            border-radius: 1.5rem;
            background: rgba(9, 13, 26, 0.82);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px dashed rgba(148, 163, 184, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            cursor: not-allowed;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .lock-veil.is-unlocked {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 今日解鎖專屬發光邊框 */
        .today-highlight .card-face {
            border: 2px solid rgba(56, 189, 248, 0.9);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.45), 0 0 60px rgba(139, 92, 246, 0.25);
        }

        /* 未解鎖點擊時輕微搖晃回饋 */
        @keyframes lockedShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }

        .shake-feedback {
            animation: lockedShake 0.35s ease-in-out;
        }

        /* 自訂捲軸（卡片背面長勵志語時美觀捲動） */
        .quote-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .quote-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 9999px;
        }
        .quote-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
        }
    </style>
</head>

        /* =========================================================
           工具函式：日期格式化與提示訊息
        ========================================================= */
        function formatUTCDate(dateObj) {
            const y = dateObj.getUTCFullYear();
            const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayLocalYMD() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function showToast(message, iconClass = 'fa-info-circle text-sky-400') {
            const box = document.getElementById('toast-box');
            const text = document.getElementById('toast-text');
            const icon = document.getElementById('toast-icon');
            if (!box || !text || !icon) return;

            text.textContent = message;
            icon.className = `fa ${iconClass}`;
            box.classList.remove('opacity-0', 'translate-y-4');
            box.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.add('opacity-0', 'translate-y-4');
                box.classList.remove('opacity-100', 'translate-y-0');
            }, 2600);
        }

                        void tiltShell.offsetWidth;

                });

                lockVeil.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleFlip();
                });

                // 綁定桌面端滑鼠 3D 磁浮傾斜與全息高光
                stage.addEventListener('mousemove', (e) => {
                    if (window.matchMedia('(pointer: coarse)').matches) return;
                    const rect = tiltShell.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -7;
                    const rotateY = ((x - centerX) / centerX) * 7;

                    tiltShell.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-4px)`;
                    stage.style.setProperty('--mx', `${((x / rect.width) * 100).toFixed(1)}%`);
                    stage.style.setProperty('--my', `${((y / rect.height) * 100).toFixed(1)}%`);
                });

                stage.addEventListener('mouseleave', () => {
                    tiltShell.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
                });

                container.appendChild(stage);
            });
        }

        /* =========================================================
           更新卡牌解鎖狀態、今日高亮與篩選顯示
        ========================================================= */
        function refreshCardStates() {
            const todayStr = getTodayLocalYMD();
            const stages = document.querySelectorAll('.card-stage');
            let unlockedCount = 0;
            let visibleCount = 0;

            stages.forEach((stage) => {
                const dateStr = stage.dataset.date;
                const lockVeil = stage.querySelector('.lock-veil');
                const statusPill = stage.querySelector('.status-pill');

                const isPast = dateStr < todayStr;
                const isToday = dateStr === todayStr;
                const isFuture = dateStr > todayStr;

                stage.dataset.state = isToday ? 'today' : (isPast ? 'past' : 'future');
                stage.dataset.locked = isFuture ? 'true' : 'false';

                if (isPast || isToday) {
                    unlockedCount++;
                }

                // 決定是否解鎖遮罩
                if (!isFuture || previewAllUnlocked) {
                    lockVeil.classList.add('is-unlocked');
                } else {
                    lockVeil.classList.remove('is-unlocked');
                    stage.querySelector('.flip-inner').classList.remove('is-flipped');
                }

                // 今日專屬光環與狀態標籤
                stage.classList.toggle('today-highlight', isToday);
                if (isToday) {
                    statusPill.innerHTML = '<i class="fa fa-star text-yellow-300 mr-1"></i>今日解鎖';
                    statusPill.className = 'status-pill px-2.5 py-1 rounded-full text-xs font-bold bg-sky-500/80 text-white shadow-md';
                } else if (isPast) {
                    statusPill.innerHTML = '<i class="fa fa-check-circle text-emerald-300 mr-1"></i>已解鎖';
                    statusPill.className = 'status-pill px-2.5 py-1 rounded-full text-xs font-bold bg-black/35 text-emerald-200';
                } else {
                    statusPill.textContent = dateStr;
                    statusPill.className = 'status-pill px-2.5 py-1 rounded-full text-xs font-bold bg-black/30 text-white/90';
                }

                // 套用分類篩選
                let show = true;
                if (currentFilter === 'unlocked') {
                    show = (!isFuture || previewAllUnlocked);
                } else if (currentFilter === 'today') {
                    show = isToday;
                } else if (currentFilter === 'locked') {
                    show = (isFuture && !previewAllUnlocked);
                }

                stage.classList.toggle('hidden', !show);
                if (show) visibleCount++;
            });

            // 空狀態顯示控制
            const emptyState = document.getElementById('empty-state');
            if (emptyState) {
                emptyState.classList.toggle('hidden', visibleCount > 0);
            }

            // 更新衝刺進度條
            const percent = Math.min(100, Math.round((unlockedCount / TOTAL_DAYS) * 100));
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressLabel = document.getElementById('progress-label');

            if (progressBar) progressBar.style.width = `${percent}%`;
            if (progressPercent) progressPercent.textContent = `${percent}%`;
            if (progressLabel) {
                if (unlockedCount === 0) {
                    progressLabel.textContent = `尚未進入 66 天倒數期（將於 2026-11-17 啟動）`;
                } else if (unlockedCount >= TOTAL_DAYS) {
                    progressLabel.textContent = `66 天能量卡已全數解鎖，學測加油！`;
                } else {
                    progressLabel.textContent = `已解鎖 ${unlockedCount} / ${TOTAL_DAYS} 張能量卡`;
                }
            }
        }

        /* =========================================================
           即時倒數計時器（精確到秒，倒數至 2027-01-21 00:00:00）
        ========================================================= */
        function startCountdown() {
            const elDays = document.getElementById('cd-days');
            const elHours = document.getElementById('cd-hours');
            const elMinutes = document.getElementById('cd-minutes');
            const elSeconds = document.getElementById('cd-seconds');

            const pad = (n) => String(n).padStart(2, '0');

            const tick = () => {
                const now = Date.now();
                const diff = EXAM_TARGET_LOCAL.getTime() - now;

                if (diff <= 0) {
                    elDays.textContent = '00';
                    elHours.textContent = '00';
                    elMinutes.textContent = '00';
                    elSeconds.textContent = '00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                elDays.textContent = pad(days);
                elHours.textContent = pad(hours);
                elMinutes.textContent = pad(minutes);
                elSeconds.textContent = pad(seconds);
            };

            tick();
            setInterval(tick, 1000);
        }

        /* =========================================================
           綁定控制列互動事件
        ========================================================= */
        function bindControls() {
            // 篩選按鈕
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach((btn) => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    filterBtns.forEach((b) => {
                        const active = b === btn;
                        b.className = active
                            ? 'filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-sky-500 text-white shadow-lg shadow-sky-500/25'
                            : 'filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white/5 text-slate-300 hover:bg-white/10 border border-white/10';
                    });
                    refreshCardStates();
                });
            });

            // 預覽全部解鎖切換
            const previewToggle = document.getElementById('toggle-preview-all');
            if (previewToggle) {
                previewToggle.addEventListener('change', (e) => {
                    previewAllUnlocked = e.target.checked;
                    refreshCardStates();
                    if (previewAllUnlocked) {
                        showToast('已開啟「預覽全部解鎖」，現在可點擊任意卡牌翻轉查看！', 'fa-unlock text-fuchsia-400');
                    } else {
                        showToast('已恢復依照日期自動解鎖模式', 'fa-lock text-sky-400');
                    }
                });
            }

            // 定位今日卡牌按鈕
            const jumpBtn = document.getElementById('btn-jump-today');
            if (jumpBtn) {
                jumpBtn.addEventListener('click', () => {
                    const todayCard = document.querySelector('.card-stage[data-state="today"]');
                    if (!todayCard) {
                        showToast('今天不在 2026-11-17 ～ 2027-01-21 倒數區間內喔！', 'fa-calendar text-amber-400');
                        return;
                    }
                    // 若目前被篩選隱藏，自動切回全部
                    if (todayCard.classList.contains('hidden')) {
                        const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                        if (allBtn) allBtn.click();
                    }
                    todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    showToast(`已定位至今日卡牌（倒數第 ${todayCard.dataset.day} 天）`, 'fa-star text-yellow-300');
                });
            }
        }

        /* =========================================================
           輕量 Canvas 星空粒子背景（支援視窗縮放）
        ========================================================= */
        function initStarfield() {
            const canvas = document.getElementById('starfield-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let stars = [];
            let width = 0, height = 0;

            const resize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                const count = Math.min(110, Math.floor((width * height) / 14000));
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.6 + 0.4,
                    vx: (Math.random() - 0.5) * 0.22,
                    vy: (Math.random() - 0.5) * 0.22,
                    alpha: Math.random() * 0.65 + 0.25
                }));
            };

            const draw = () => {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.x < 0) s.x = width;
                    if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height;
                    if (s.y > height) s.y = 0;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(186, 230, 253, ${s.alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            };

            window.addEventListener('resize', resize);
            resize();
            draw();
        }

        // 頁面初始化入口
        document.addEventListener('DOMContentLoaded', () => {
            try {
                generateFloatingCards();
                refreshCardStates();
                startCountdown();
                bindControls();
                initStarfield();
            } catch (err) {
                console.error('初始化倒數計時器時發生錯誤：', err);
            }
        });
    </script>
